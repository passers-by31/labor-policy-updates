general:
  output_dir: ../data
  request_timeout: 30
  max_retries: 3
  batch_size: 50
  user_agents:
  - Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko)
    Chrome/125.0.0.0 Safari/537.36
  - Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/605.1.15 (KHTML, like
    Gecko) Version/17.5 Safari/605.1.15
  - Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko)
    Chrome/125.0.0.0 Safari/537.36 Edg/125.0.0.0
  - Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0
    Safari/537.36
  - Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML,
    like Gecko) Version/17.5 Mobile/15E148 Safari/604.1
sources:
- id: mohrss
  name: 人力资源和社会保障部
  base_url: https://www.mohrss.gov.cn
  encoding: utf-8
  region: 全国
  active: true
  crawl_interval_hours: 24
  list_pages:
  - url: https://www.mohrss.gov.cn/xxgk2020/zcwjk/
    name: 政策文件库
    list_selector: ul.list-list li a
    max_pages: 1
  detail_rules:
    title_selector: div.content-title h1, div.article-title h1
    content_selector: div.TRS_Editor, div.content-body, div.article-content
    publish_date_selector: div.content-info span.date, div.article-info span.date
    document_number_selector: div.content-info, div.article-info
  # 注意: 该站点有反爬 JS 验证，如果爬取失败是正常现象
  # 可以尝试改用 selenium/playwright 等浏览器自动化方案
- id: govcn
  name: 中央人民政府（国务院）
  base_url: https://www.gov.cn
  encoding: utf-8
  region: 全国
  active: true
  crawl_interval_hours: 24
  list_pages:
  - url: https://www.gov.cn/zhengce/zuixin/ZUIXINZHENGCE.json
    name: 最新政策（JSON API）
    max_pages: 1
  - url: https://www.gov.cn/zhengce/zuixin.htm
    name: 最新政策（HTML）
    list_selector: ul.list_tab li a
    max_pages: 1
  detail_rules: &id001
    title_selector: div.content-title h1, div.article-title h1, h1
    content_selector: div.TRS_Editor, div.content-body, div.article-content
    publish_date_selector: div.content-info span.date, div.article-info span.date
    document_number_selector: div.content-info, div.article-info
- id: nhsa
  name: 国家医疗保障局
  base_url: https://www.nhsa.gov.cn
  encoding: utf-8
  region: 全国
  active: true
  crawl_interval_hours: 48
  list_pages:
  - url: https://www.nhsa.gov.cn/col/col14/index.html
    name: 医保动态
    list_selector: div.mainbody li a
    max_pages: 1
  detail_rules:
    title_selector: div.atricle-title
    content_selector: div#zoom
    publish_date_selector: span.wzy-rq
    document_number_selector: ''
- id: chinatax
  name: 国家税务总局
  base_url: https://www.chinatax.gov.cn
  encoding: utf-8
  region: 全国
  active: false
  crawl_interval_hours: 48
  list_pages:
  - url: https://www.chinatax.gov.cn/chinatax/n810341/n810755/index.html
    name: 社保费政策
    list_selector: ul.list li a
    max_pages: 3
  detail_rules:
    title_selector: div.content h1
    content_selector: div.content, div.TRS_Editor
    publish_date_selector: div.info span
    document_number_selector: div.info
- id: guangdong-chinatax
  name: 国家税务总局广州市税务局
  base_url: https://guangdong.chinatax.gov.cn
  encoding: utf-8
  region: 广州
  active: true
  crawl_interval_hours: 48
  list_pages:
  - url: https://guangdong.chinatax.gov.cn/gdsw/gzsw_gkwj/city_list.shtml
    name: 广州税务-最新文件
    list_selector: '#ajaxlist li.itm h4 a'
    max_pages: 1
  - url: https://guangdong.chinatax.gov.cn/gdsw/gzsw_tggg/city_list.shtml
    name: 广州税务-通知公告
    list_selector: '#ajaxlist li.itm h4 a'
    max_pages: 1
  detail_rules:
    title_selector: div.title, h1
    content_selector: div#zoomcon, div.TRS_Editor
    publish_date_selector: span#lawfwrq, span.publishTime
    document_number_selector: div.memo
- id: shanghai-chinatax
  name: 国家税务总局上海市税务局
  base_url: https://shanghai.chinatax.gov.cn/zcfw/zxwj/
  encoding: utf-8
  region: 上海
  active: true
  crawl_interval_hours: 48
  list_pages:
  - url: https://shanghai.chinatax.gov.cn/zcfw/zxwj/
    name: 上海税务-最新文件
    list_selector: ul.infolist li a.info
    max_pages: 1
  detail_rules:
    title_selector: h1#ivs_title, h1
    content_selector: div.article_content, div.TRS_Editor, div.rich_text_editor
    publish_date_selector: span#ivs_date
    document_number_selector: div.head_show
- id: banshi-beijing
  name: 北京市政务服务网
  base_url: https://banshi.beijing.gov.cn
  encoding: utf-8
  region: 全国
  active: true
  crawl_interval_hours: 48
  list_pages:
  - url: https://banshi.beijing.gov.cn
    name: 北京市政务服务网
    list_selector: ul.list-list li a, ul.list li a, div.news-list li a
    max_pages: 1
  detail_rules: *id001
province_defaults:
  active: false
  crawl_interval_hours: 72
  encoding: utf-8
  list_selector: ul.list-list li a, ul.list li a, div.news-list li a
  detail_rules:
    title_selector: div.content-title h1, div.article-title h1, h1
    content_selector: div.TRS_Editor, div.content-body, div.article-content
    publish_date_selector: div.content-info span.date, div.article-info span.date
    document_number_selector: div.content-info, div.article-info
