name: 自动采集政策数据

on:
  schedule:
    - cron: '0 1 * * *'        # 每天 UTC 1:00（北京时间 9:00）
  workflow_dispatch:            # 支持手动触发
  push:
    branches: [main]            # 代码推送时也构建部署

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '24'

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: crawler/requirements.txt

      - name: 安装爬虫依赖
        run: |
          pip install -r crawler/requirements.txt

      - name: 运行爬虫
        run: |
          PYTHONPATH=$PWD python -m crawler.main --config crawler/config.yaml --output data

      - name: 检测数据变更
        id: check
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交并推送数据
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "crawler-bot"
          git config user.email "crawler-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore(data): 更新政策数据 $(date +'%Y-%m-%d')"
          gh auth setup-git
          git push

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: 安装站点依赖并构建
        run: |
          cd site
          npm ci
          node scripts/build-search-index.mjs
          npx astro build

      - name: 部署到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler pages deploy site/dist --project-name labor-policy-updates
