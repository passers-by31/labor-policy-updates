name: 自动采集政策数据

on:
  schedule:
    - cron: '0 1 * * *'        # 每天 UTC 1:00（北京时间 9:00）
  workflow_dispatch:            # 支持手动触发

env:
  PYTHON_VERSION: '3.12'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: crawler/requirements.txt

      - name: 安装爬虫依赖
        run: |
          cd crawler
          pip install -r requirements.txt

      - name: 运行爬虫
        run: |
          cd crawler
          python main.py --config config.yaml --output ../data

      - name: 检测数据变更
        id: check
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交并推送数据
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "crawler-bot"
          git config user.email "crawler-bot@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): 更新政策数据 $(date +'%Y-%m-%d')"
          git push
